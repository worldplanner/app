<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f2fc;--card:#fff;--cardA:rgba(255,255,255,.86);--tx:#3d3350;--mut:#8c82a3;--bd:#e8ddf5;--ac:#c8b4f0;--ac2:#7d52c4;--onac:#34284d;--bgimg:linear-gradient(160deg,#f8effa 0%,#f1ecfb 50%,#f6f0fa 100%)}

.tc h3{margin:0;font-size:21px;position:relative}.tc p{margin:3px 0 0;font-size:14px;opacity:.9;position:relative}

.tc.big h3{font-size:32px}.tc.big p{font-size:16px}
.empty{text-align:center;color:var(--mut);font-size:18px;margin-top:80px}
.fabw{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:5}

.menu{display:flex;flex-direction:column;gap:8px;align-items:stretch}.menu .btn,.menu button{text-align:left;box-shadow:0 4px 12px rgba(110,100,160,.25);padding:11px 16px}
.ov{position:fixed;inset:0;z-index:4}.ov.dim{background:rgba(60,50,90,.35);display:grid;place-items:end center;z-index:6}.card.sheet{max-height:86vh;overflow:auto}.swg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}.swi{text-align:center}.swi small{display:block;margin-top:4px;font-size:12px;color:var(--mut)}.sw{width:100%;height:44px;padding:0;border:2px solid var(--bd);border-radius:12px}.sw.on{border-color:var(--ac2);box-shadow:0 0 0 2px var(--ac2)}.stg-h{font-size:12px;color:var(--mut);margin:4px 0 0}

.today-card .h{font-weight:700}.today-label{color:var(--ac2);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.past-compact{min-height:64px!important;padding:12px 16px!important;border-radius:14px!important;box-shadow:none!important}.past-compact h3{font-size:18px!important}.past-compact p{font-size:13px!important}
.tabs{display:flex;gap:6px;padding:12px 14px 0}.tabs button{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--bd)}.tabs button.active{background:var(--ac);color:var(--onac);border-color:var(--ac)}
html,body{touch-action:pan-x pan-y}.lb{position:fixed;inset:0;z-index:90;background:rgba(15,12,30,.9);display:grid;place-items:center;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;overflow:hidden}.lb img{max-width:94vw;max-height:86vh;object-fit:contain;transform-origin:center center;will-change:transform;border-radius:6px;-webkit-user-drag:none;-webkit-touch-callout:none;pointer-events:auto}.lb .lbb{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:flex;gap:10px}.lb .lbs{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap}.lb .lbc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;text-align:center;color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:.85}.files-list{padding:8px 14px 120px}.file-row{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}.file-row .fn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.calendar{padding:12px 14px}.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal-cell{min-height:42px;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:5px;text-align:center;cursor:pointer}.cal-cell.muted{opacity:.35}.cal-cell{position:relative;transition:transform .15s}.cal-cell .ci{font-size:9px;line-height:1.15;margin-top:2px;word-break:break-all;font-weight:400}.cal-cell.sel{z-index:10}.cal-cell .pop{display:none}.cal-cell.sel .pop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:absolute;left:50%;top:50%;width:250%;min-width:100px;transform:translate(-50%,-50%);padding:12px 6px;border-radius:16px;background:var(--card);color:var(--tx);border:2px solid var(--ac);box-shadow:0 8px 26px rgba(60,50,110,.38);font-weight:400}.pop .pn{font-size:26px;font-weight:700;line-height:1.1}.pop .pi{font-size:18px;line-height:1.2}.pop .pt{font-size:14px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}.cal-cell.has{font-weight:700;border-color:var(--ac)}.cal-cell.today{background:var(--ac);color:var(--onac)}.img-search{display:grid;grid-template-columns:1fr 90px;gap:8px}.img-results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-height:48vh;overflow:auto}.img-results button{padding:0;background:var(--card);border:1px solid var(--bd);overflow:hidden;border-radius:10px}.img-results img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.entry-summary{color:var(--mut);font-size:13px}
.cal-cell:not(.has):not(.muted){opacity:.45;cursor:default}
.hero.noimg,.tc.noimg{color:#3a3550}.hero.noimg button.g{background:rgba(255,255,255,.6);color:#3a3550}.hero.noimg .av{background:rgba(255,255,255,.6);color:#3a3550}.tc.noimg .tag{background:rgba(255,255,255,.6)}
.cam{color:var(--onac)}
.day{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.day input,.day textarea{user-select:text;-webkit-user-select:text}.day.dragging{opacity:.45}.day.drop-before{box-shadow:0 -5px 0 var(--ac2)}.day.drop-after{box-shadow:0 5px 0 var(--ac2)}
.e.dragging,.nt.dragging{opacity:.45}.e.drop-before,.nt.drop-before{box-shadow:0 -5px 0 var(--ac2)}.e.drop-after,.nt.drop-after{box-shadow:0 5px 0 var(--ac2)}.day.drop-into{outline:3px solid var(--ac2);outline-offset:-3px}.nt>.h,.e>.t{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;background:var(--ac);color:var(--onac);padding:10px 16px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(90,100,170,.35);max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function applyTheme(id,persist){const t=THEMES.find(x=>x.id===id)||THEMES[0],r=document.documentElement.style,h=t.card.replace('#',''),rgb=[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(',');

</head><body><div id="app"></div>
<script>
const TYPES=['Abfahrt','Ankunft','Aktivitäten','Übernachtung','Sonstiges'];
const PAS=[['#bcd8f7','#d9c8f5'],['#ffd9c7','#f9c5d8'],['#c5ecd9','#bfe0f5'],['#fbe7b5','#ffcfc4'],['#d6cdf7','#bde6f2'],['#c9efd0','#f6f0b8']];
const bgOf=t=>{if(t.img)return `linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url(${t.img}) center/cover`;let h=0;for(const c of String(t.id||''))h+=c.charCodeAt(0);const p=PAS[h%PAS.length];return `linear-gradient(135deg,${p[0]},${p[1]})`};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date());
const ICON={Ankunft:'🛬',Abfahrt:'🛫',Reiseart:'🎫',Aktivitäten:'🎯',Übernachtung:'🛏️',Flug:'✈️',Zug:'🚆',Auto:'🚗',Bus:'🚌',Fähre:'⛴️',Restaurant:'🍴',Ort:'📍',Notiz:'📝',Ticket:'🎫',Reservierung:'💳'};
const IMG_API='https://commons.wikimedia.org/w/api.php';
let S={trips:[]},cur=null,open=new Set(),idb=null,adding=false,menu=false,pm=null,ps=false,col=new Set(),sc=true,tm;
const $=document.getElementById('app');
function idbOpen(){return new Promise(r=>{try{const q=indexedDB.open('urlaub',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function load(){idb=await idbOpen();if(idb)try{S=await new Promise(r=>{const q=idb.transaction('k').objectStore('k').get('s');q.onsuccess=()=>r(q.result||{trips:[]});q.onerror=()=>r({trips:[]})})}catch(e){}S.trips=S.trips||[];migrate();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render()}
function put(){if(idb)try{idb.transaction('k','readwrite').objectStore('k').put(S,'s')}catch(e){}}
function save(){clearTimeout(tm);tm=setTimeout(put,300)}
addEventListener('pagehide',put);document.addEventListener('visibilitychange',()=>{if(document.hidden)put()});
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2800)}
const fmt=(s,o)=>new Date(s+'T00:00').toLocaleDateString('de-DE',o||{day:'2-digit',month:'2-digit',year:'numeric'});
function days(t){const r=[],e=new Date(t.to+'T00:00');let d=new Date(t.from+'T00:00');while(d<=e&&r.length<400){r.push(iso(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return r}
const nx=k=>{const d=new Date(k+'T00:00');return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))};
function migrate(){S.trips.forEach(t=>{t.days=t.days||{};Object.values(t.days).flat().forEach(e=>{if(e.type==='Sonstiges')e.renameable=true});})}
let cf=null,om=false,ed=false,stg=false;
const shiftKey=(k,n)=>{const d=new Date(k+'T00:00');return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))};
const bad=(f,to)=>!f||!to||to<f||days({from:f,to}).length>399;
function push(){try{history.pushState({t:1},'')}catch(e){}}
addEventListener('popstate',()=>{if(window._skipPop){window._skipPop=false;window._ph=true;return}if(window._lb){closeLb(true);window._ph=true;return}if(cur){cur=null;sc=true;om=ed=pm=ps=adding=menu=stg=false;cf=null;render()}});
const ask=(msg,fn,lbl)=>{cf={msg,fn,lbl}};
function render(){let t=S.trips.find(x=>x.id===cur);if(cur&&!t)cur=null;t?tripView(t):listView();extra(t)}
function extra(t){let h='';const sh=(b,bd)=>h+=`<div class="ov dim"${bd?` data-bd="${bd}"`:''}><div class="card add sheet">${b}</div></div>`;
if(stg){const cu=window._themeId||'flieder',sw=d=>THEMES.filter(x=>!!x.dark===d).map(x=>`<div class="swi"><button class="sw${x.id===cu?' on':''}" data-a="theme" data-id="${x.id}" title="${x.name}" aria-label="${x.name}" style="background:linear-gradient(135deg,${x.bg} 50%,${x.ac} 50%)"></button><small>${x.name}</small></div>`).join('');

async function sync(manual){

   if(!loc||(rem[id].mod>(loc.mod||0))){

   if(!r){if(S.synced[t.id]){S.trips=S.trips.filter(x=>x!==t);delete snap[t.id];delete S.synced[t.id];ch=true}
    else{await upload(t);S.synced[t.id]=1}}
   else if((t.mod||0)>r.mod){await upload(t,r.fid);S.synced[t.id]=1}}
  {const P=S.pers,rp=rem.__pers;
   if(!rp){if(P.files.length||P.mod)await upload({files:P.files,mod:P.mod},null,'personal.json')}

   else if((P.mod||0)>rp.mod)await upload({files:P.files,mod:P.mod},rp.fid,'personal.json')}
  _put();if(ch)render();
  setSt('ok');if(manual)toast('Synchronisiert')
 }catch(e){console.error(e);setSt(navigator.onLine?'err':'offline');if(manual)toast('Sync fehlgeschlagen')}
 busy=false}

 const o=document.createElement('div');o.className='lb';
