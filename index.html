ing:12px 6px;border-radius:16px;background:var(--card);color:var(--tx);border:2px solid var(--ac);box-shadow:0 8px 26px rgba(60,50,110,.38);font-weight:400}.pop .pn{font-size:26px;font-weight:700;line-height:1.1}.pop .pi{font-size:18px;line-height:1.2}.pop .pt{font-size:14px;font-weight:600;line-height:1.2;text-align:center;overflow-wrap:anywhere}.cal-cell.has{font-weight:700;border-color:var(--ac)}.cal-cell.today{background:var(--ac);color:var(--onac)}.img-search{display:grid;grid-template-columns:1fr 90px;gap:8px}.img-results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-height:48vh;overflow:auto}.img-results button{padding:0;background:var(--card);border:1px solid var(--bd);overflow:hidden;border-radius:10px}.img-results img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.entry-summary{color:var(--mut);font-size:13px}

/* --- Geocoding: Google (mit Schlüssel) sonst OpenStreetMap/Nominatim; Ergebnis wird am Eintrag gespeichert --- */
async function geocode(q){
 const m=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(q);
 if(m){const la=+m[1],ln=+m[2];if(Math.abs(la)<=90&&Math.abs(ln)<=180)return{lat:la,lng:ln}}
 if(gKey()&&!gBroken){try{const j=await (await fetch('https://maps.googleapis.com/maps/api/geocode/json?language=de&key='+encodeURIComponent(gKey())+'&address='+encodeURIComponent(q))).json();
  if(j.status==='OK'&&j.results[0]){const l=j.results[0].geometry.location;return{lat:l.lat,lng:l.lng}}
  if(j.status==='ZERO_RESULTS')return null}catch(e){}}
 try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q='+encodeURIComponent(q));
  if(r.ok){const j=await r.json();return j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null}}catch(e){}
 const r2=await fetch('https://photon.komoot.io/api/?limit=1&lang=de&q='+encodeURIComponent(q));if(!r2.ok)throw new Error('geo '+r2.status);
 const f=((await r2.json()).features||[])[0];return f?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}:null}
let gqP=Promise.resolve();
function geoQ(q){const run=gqP.catch(()=>{}).then(()=>geocode(q));const wait=()=>new Promise(r=>setTimeout(r,gKey()&&!gBroken?150:1100));gqP=run.then(wait,wait);return run}
/* Erst genau so suchen; wenn nichts gefunden wird, mit dem Reiseziel ergänzen (z. B. "Sagrada Familia" + "Barcelona") */
async function geoFor(q,t){let r=await geoQ(q);if(!r&&t&&t.dest&&!q.toLowerCase().includes(String(t.dest).toLowerCase()))r=await geoQ(q+', '+t.dest);return r}
const geoOk=ref=>{const q=String(ref.loc||'').trim();return !!(ref.geo&&ref.geo.q===q&&isFinite(ref.geo.lat)&&isFinite(ref.geo.lng))};

const DAYCOL=['#7d6bd6','#e0668f','#2f9e7a','#e08a2e','#2f86d0','#b8569c','#4aa3a0','#c9743d'];
const dayCol=p=>p.dk==='notes'?'#8c82a3':DAYCOL[Math.max(0,p.di)%DAYCOL.length];
function collectPlaces(t){const ds=days(t),out=[],cnt={};
 Object.keys(t.days).sort().forEach(d=>(t.days[d]||[]).forEach(e=>{const q=String(e.loc||'').trim();if(!q)return;const i=ds.indexOf(d);cnt[d]=(cnt[d]||0)+1;
  out.push({id:e.id,ref:e,loc:q,dk:d,di:i,num:cnt[d],icon:ICON[e.type]||'📌',title:(e.type||'Eintrag')+(e.title?': '+e.title:''),sub:(i>=0?'Tag '+(i+1)+' · ':'')+fmt(d,{weekday:'short',day:'2-digit',month:'2-digit'})+(e.time?' · '+e.time:'')})}));
 (t.notes||[]).forEach((n,k)=>{const q=String(n.loc||'').trim();if(!q)return;out.push({id:n.id,ref:n,loc:q,dk:'notes',di:-1,num:k+1,icon:'📝',title:n.title||'Notiz',sub:'Notiz'})});
 return out}
function mapChips(t,places){const hid=new Set(t.mapHide||[]),g=[],seen={};places.forEach(p=>{if(!seen[p.dk]){seen[p.dk]={p,n:0};g.push(seen[p.dk])}seen[p.dk].n++});
 if(g.length<2)return'';const allOn=g.every(x=>!hid.has(x.p.dk));
 return '<button class="mchip all" data-mp="tgall">'+(allOn?'Alle aus':'Alle an')+'</button>'+g.map(x=>{const p=x.p,on=!hid.has(p.dk);
  return `<button class="mchip${on?' on':''}" data-mp="tgd" data-d="${p.dk}" style="--c:${dayCol(p)}"><i></i>${p.dk==='notes'?'📝 Notizen':(p.di>=0?'Tag '+(p.di+1)+' · ':'')+fmt(p.dk,{day:'2-digit',month:'2-digit'})} (${x.n})</button>`}).join('')}
function mapChipsUpd(){const el=document.getElementById('mapchips');if(el&&mapSt)el.innerHTML=mapChips(mapSt.t,mapSt.places)}

/* --- Kartenanbieter --- */
const LF={
 load(){if(window.L)return Promise.resolve();return LF.p||(LF.p=new Promise((res,rej)=>{const c=document.createElement('link');c.rel='stylesheet';c.href='lib/leaflet.css';document.head.append(c);const s=document.createElement('script');s.src='lib/leaflet.js';s.onload=()=>res();s.onerror=()=>{LF.p=null;rej(new Error('leaflet'))};document.head.append(s)}))},
 async create(el){LF.map=L.map(el,{worldCopyJump:true}).setView([25,10],2);L.tileLayer(LS.get('tile_url')||'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{subdomains:'abcd',maxZoom:18,referrerPolicy:'origin',attribution:LS.get('tile_url')?'Kartendaten © OpenStreetMap-Mitwirkende':'Kacheln © Esri, HERE, Garmin, OpenStreetMap-Mitwirkende'}).addTo(LF.map);LF.lg=L.layerGroup().addTo(LF.map);setTimeout(()=>{try{LF.map&&LF.map.invalidateSize()}catch(e){}},250)},
 clear(){LF.lg&&LF.lg.clearLayers()},
 add(g){g.m=L.marker([g.lat,g.lng],{icon:L.divIcon({className:'',html:'<div class="pin" style="background:'+g.color+'">'+g.lab+'</div>',iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-17]})}).bindPopup(g.html,{maxWidth:260}).addTo(LF.lg)},
 fit(pts){const m=LF.map;if(!m)return;if(!pts.length)m.fitWorld();else if(pts.length===1)m.setView([pts[0].lat,pts[0].lng],14);else m.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[44,44],maxZoom:15})},
 focus(g){LF.map.setView([g.lat,g.lng],Math.max(LF.map.getZoom(),14));g.m.openPopup()},
 destroy(){try{LF.map&&LF.map.remove()}catch(e){}LF.map=null}};
const GM={
 load(){if(GM.p)return GM.p;return GM.p=new Promise((res,rej)=>{window.gm_authFailure=()=>{gBroken=true;toast('Google-Maps-Schlüssel abgelehnt – nutze OpenStreetMap');render()};window.__gmInit=()=>res();
  const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(gKey())+'&loading=async&callback=__gmInit&language=de&v=weekly';s.onerror=()=>{GM.p=null;rej(new Error('gm'))};document.head.append(s);setTimeout(()=>rej(new Error('timeout')),12000)})},
 async create(el){const{Map,InfoWindow}=await google.maps.importLibrary('maps');await google.maps.importLibrary('marker');
  GM.map=new Map(el,{center:{lat:25,lng:10},zoom:2,mapId:'DEMO_MAP_ID',streetViewControl:false,mapTypeControl:false,fullscreenControl:false});GM.iw=new InfoWindow();GM.ms=[]},
 clear(){(GM.ms||[]).forEach(m=>{m.map=null});GM.ms=[]},
 add(g){const c=document.createElement('div');c.className='pin';c.innerHTML=g.lab;c.style.background=g.color;const m=new google.maps.marker.AdvancedMarkerElement({map:GM.map,position:{lat:g.lat,lng:g.lng},content:c});m.addListener('click',()=>GM.open(g));g.m=m;GM.ms.push(m)},
 open(g){GM.iw.setContent('<div style="color:#3d3350;font-size:14px;line-height:1.35">'+g.html+'</div>');GM.iw.open({map:GM.map,anchor:g.m})},
 fit(pts){const m=GM.map;if(!m)return;if(!pts.length){m.setCenter({lat:25,lng:10});m.setZoom(2);return}if(pts.length===1){m.setCenter(pts[0]);m.setZoom(14);return}
  const b=new google.maps.LatLngBounds();pts.forEach(p=>b.extend(p));m.fitBounds(b,48);google.maps.event.addListenerOnce(m,'idle',()=>{if(m.getZoom()>15)m.setZoom(15)})},
 focus(g){GM.map.panTo({lat:g.lat,lng:g.lng});if(GM.map.getZoom()<14)GM.map.setZoom(14);GM.open(g)},
 destroy(){GM.map=null;GM.ms=[]}};
const MPA=()=>gKey()&&!gBroken?GM:LF;

/* --- Tab "Karte" --- */
function mapView(t){return `<div class="pad"><div class="mapchips" id="mapchips">${mapChips(t,collectPlaces(t))}</div><div class="mapbox"><div id="mapel"></div></div><div class="mapnote" id="mapmsg"></div><div class="mapbar" id="mapbar"></div><div id="maplist"></div></div>`}
const setMsg=m=>{const e=document.getElementById('mapmsg');if(e)e.textContent=m||''};
function groupsOf(){const hid=new Set((mapSt.t.mapHide)||[]),M={};mapSt.places.filter(p=>geoOk(p.ref)&&!hid.has(p.dk)).forEach(p=>{const k=p.ref.geo.lat.toFixed(4)+','+p.ref.geo.lng.toFixed(4);(M[k]=M[k]||{lat:p.ref.geo.lat,lng:p.ref.geo.lng,items:[]}).items.push(p)});
 return Object.values(M).map(g=>{const p0=g.items[0];g.icon=p0.icon;g.color=dayCol(p0);g.lab=(p0.dk==='notes'?'📝':p0.num)+(g.items.length>1?'<i>+'+(g.items.length-1)+'</i>':'');
  g.html=g.items.map(p=>`<div class="mpi"><b>${p.dk==='notes'?'':p.num+'. '}${p.icon} ${esc(p.title)}</b><br><small>${esc(p.sub)}</small><br>${esc(p.loc)}<br><a href="${gmapsUrl(p.loc)}" target="_blank" rel="noopener">↗ In Google Maps öffnen</a></div>`).join('');return g})}
function paint(fit){if(!mapSt)return;const A=mapSt.A;if(!A.map)return;A.clear();mapSt.groups=groupsOf();mapSt.groups.forEach(g=>A.add(g));if(fit)A.fit(mapSt.groups.map(g=>({lat:g.lat,lng:g.lng})));listUpd()}
function listUpd(){const L=document.getElementById('maplist'),B=document.getElementById('mapbar');if(!L||!mapSt)return;const hid=new Set(mapSt.t.mapHide||[]);
 const bad=mapSt.places.filter(p=>!hid.has(p.dk)&&!geoOk(p.ref)&&geoFail.has(p.loc)).length;
 L.innerHTML=mapSt.places.map((p,i)=>{if(hid.has(p.dk))return'';const ok=geoOk(p.ref),st=ok?'':geoFail.has(p.loc)?'⚠️':'⏳';
  return `<div class="mrow" data-mp="focus" data-i="${i}"><span class="mnum" style="background:${dayCol(p)}">${p.dk==='notes'?'📝':p.num}</span><div class="mt"><b>${p.icon} ${esc(p.title)}</b><small>${esc(p.sub)}</small><small>📍 ${esc(p.loc)}</small></div><span class="ms" title="${ok?'':geoFail.has(p.loc)?'Ort nicht gefunden':'Wird gesucht …'}">${st}</span><a class="mg" href="${gmapsUrl(p.loc)}" target="_blank" rel="noopener" aria-label="In Google Maps öffnen">↗</a></div>`}).join('');
 if(B)B.innerHTML=mapSt.groups.length>1?'<button class="g" data-mp="fit">🔍 Alle Pins zeigen</button>':'';
 if(B&&bad)B.innerHTML+='<button class="g" data-mp="retry">↻ Nicht gefundene erneut suchen</button>'}
function mapDestroy(){mapTok++;if(mapSt){try{mapSt.A.destroy()}catch(e){}}mapSt=null}
async function mapBoot(){
 const el=document.getElementById('mapel');if(!el)return;const t=S.trips.find(x=>x.id===cur);if(!t||t.tab!=='map')return;
 const tok=++mapTok,A=MPA();mapSt={t,A,places:collectPlaces(t),groups:[]};listUpd();
 if(!mapSt.places.length)setMsg('Noch keine Orte. Trage bei Einträgen oder Notizen unter „Ort“ eine Adresse oder einen Ortsnamen ein.');
 try{await A.load();if(tok!==mapTok)return;await A.create(el)}
 catch(e){if(tok!==mapTok)return;if(A===GM){gBroken=true;toast('Google Maps konnte nicht geladen werden – nutze OpenStreetMap');render();return}setMsg('Karte konnte nicht geladen werden (Internetverbindung nötig).');return}
 if(tok!==mapTok)return;
 paint(true);
 if(mapFocus){const f=mapFocus;mapFocus=null;const g=mapSt.groups.find(g=>g.items.some(p=>p.id===f));if(g)A.focus(g)}
 const need=mapSt.places.filter(p=>!geoOk(p.ref)&&!geoFail.has(p.loc));
 if(!need.length){if(mapSt.places.length&&!navigator.onLine)setMsg('Offline – Karten-Kacheln können fehlen.');else if(mapSt.places.length)setMsg(mapSt.groups.reduce((n,g)=>n+g.items.length,0)+' Ort(e) auf der Karte.');return}
 if(!navigator.onLine){setMsg('Offline – neue Orte werden gesucht, sobald du wieder online bist.');return}
 let n=0,added=false;
 for(const p of need){if(tok!==mapTok)return;n++;setMsg('Orte werden gesucht … ('+n+'/'+need.length+')');
  if(geoOk(p.ref))continue;
  const twin=mapSt.places.find(x=>x!==p&&x.loc===p.loc&&geoOk(x.ref));
  try{const r=twin?twin.ref.geo:await geoFor(p.loc,t);if(tok!==mapTok)return;
   if(r){p.ref.geo={q:p.loc,lat:r.lat,lng:r.lng};added=true;save();paint(true)}else{geoFail.add(p.loc);listUpd()}}
  catch(e){if(tok!==mapTok)return;setMsg('Orte konnten gerade nicht gesucht werden (Verbindung?).');listUpd();return}}
 if(tok!==mapTok)return;const f=mapSt.places.filter(p=>geoFail.has(p.loc)&&!geoOk(p.ref)).length;
 setMsg(mapSt.groups.reduce((c,g)=>c+g.items.length,0)+' Ort(e) auf der Karte.'+(f?' '+f+' nicht gefunden (⚠️) – bitte Schreibweise prüfen.':''))}

/* --- Klicks: Karte-Buttons, Liste --- */
$.addEventListener('click',e=>{const el=e.target.closest('[data-mp]');if(!el||e.target.closest('a'))return;const a=el.dataset.mp,t=S.trips.find(x=>x.id===cur);if(!t)return;
 if(a==='tgd'||a==='tgall'){const pl=mapSt?mapSt.places:collectPlaces(t),dks=[...new Set(pl.map(p=>p.dk))];let h=new Set(t.mapHide||[]);
  if(a==='tgd'){const d=el.dataset.d;h.has(d)?h.delete(d):h.add(d)}else{h=dks.every(k=>!h.has(k))?new Set(dks):new Set()}
  t.mapHide=[...h];save();if(mapSt){mapChipsUpd();paint(true);const n=mapSt.groups.reduce((c,g)=>c+g.items.length,0);setMsg(dks.every(k=>h.has(k))?'Alle Tage ausgeblendet – Tage oben antippen.':n+' Ort(e) auf der Karte.')}}
 else if(a==='goE'||a==='goN'){mapFocus=el.dataset.id;if(t.mapHide&&t.mapHide.length){const id=el.dataset.id,dk=Object.keys(t.days).find(d=>(t.days[d]||[]).some(x=>x.id===id))||'notes';t.mapHide=t.mapHide.filter(x=>x!==dk)};mapFocus=el.dataset.id;t.tab='map';save();scrollTo(0,0);render()}
 else if(a==='fit'){if(mapSt)mapSt.A.fit(mapSt.groups.map(g=>({lat:g.lat,lng:g.lng})))}
 else if(a==='retry'){geoFail.clear();render()}
 else if(a==='focus'&&mapSt){const p=mapSt.places[+el.dataset.i];if(!p)return;
  if(!geoOk(p.ref))return toast(geoFail.has(p.loc)?'Ort nicht gefunden – bitte Schreibweise prüfen':'Ort wird noch gesucht …');
  const g=mapSt.groups.find(g=>g.items.includes(p));if(g){const b=document.querySelector('.mapbox');b&&b.scrollIntoView({behavior:'smooth',block:'center'});mapSt.A.focus(g)}}});

/* --- Ort-Feld geändert: sofort suchen und am Eintrag speichern --- */
$.addEventListener('change',async e=>{const el=e.target;if(el.dataset.f!=='loc'&&el.dataset.nf!=='loc')return;
 const t=S.trips.find(x=>x.id===cur);if(!t)return;
 const ref=el.dataset.f?findE(el.closest('[data-e]').dataset.e)[2]:(t.notes||[]).find(n=>n.id===el.dataset.id);if(!ref)return;
 const q=String(ref.loc||'').trim();if(!q){delete ref.geo;save();return}if(geoOk(ref))return;
 if(!navigator.onLine)return toast('Ort gespeichert – wird auf der Karte gesucht, sobald du online bist.');
 try{const r=await geoFor(q,t);if(String(ref.loc||'').trim()!==q)return;
  if(r){ref.geo={q,lat:r.lat,lng:r.lng};geoFail.delete(q);save();toast('📍 Ort gefunden')}else{geoFail.add(q);toast('Ort nicht gefunden – bitte genauer eingeben')}}
 catch(err){toast('Ort gespeichert – Suche gerade nicht möglich')}});


/* --- Adress-Vorschläge beim Tippen (Google Places mit Schlüssel, sonst Photon/OpenStreetMap) --- */
(function(){const st=document.createElement('style');st.textContent='.ac{border:1px solid var(--bd);background:var(--card);border-radius:10px;margin-top:4px;overflow:hidden}.ac div{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--bd)}.ac div:last-child{border:0}.ac small{display:block;color:var(--mut);font-size:12px}';document.head.append(st)})();
let acTok=0,acT=null;const acClear=()=>document.querySelectorAll('.ac').forEach(x=>x.remove());
async function suggest(q){
 if(gKey()&&!gBroken){try{const r=await fetch('https://places.googleapis.com/v1/places:autocomplete',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':gKey()},body:JSON.stringify({input:q,languageCode:'de'})});
  if(r.ok){const L=((await r.json()).suggestions||[]).filter(x=>x.placePrediction).map(x=>{const pp=x.placePrediction,sf=pp.structuredFormat;return{main:sf?sf.mainText.text:pp.text.text,sub:sf&&sf.secondaryText?sf.secondaryText.text:'',text:pp.text.text}});if(L.length)return L}}catch(e){}}
 const r=await fetch('https://photon.komoot.io/api/?limit=5&lang=de&q='+encodeURIComponent(q));if(!r.ok)throw new Error('photon');const seen=new Set(),out=[];
 ((await r.json()).features||[]).forEach(f=>{const p=f.properties||{},c=f.geometry.coordinates,street=[p.street,p.housenumber].filter(Boolean).join(' '),city=[p.postcode,p.city||p.town||p.village||p.county||p.state].filter(Boolean).join(' ');
  const parts=[p.name,street,city,p.country].filter((x,i,a)=>x&&a.indexOf(x)===i),text=parts.join(', ');if(!text||seen.has(text))return;seen.add(text);
  out.push({main:parts[0],sub:parts.slice(1).join(', '),text,lat:c[1],lng:c[0]})});return out}
function acRef(el){const t=S.trips.find(x=>x.id===cur);if(!t)return null;return el.dataset.f?findE(el.closest('[data-e]').dataset.e)[2]:(t.notes||[]).find(n=>n.id===el.dataset.id)}
function acPick(el,s){const ref=acRef(el);if(!ref)return;ref.loc=s.text;el.value=s.text;acClear();const q=s.text.trim();
 if(s.lat!=null){ref.geo={q,lat:s.lat,lng:s.lng};geoFail.delete(q);save();toast('📍 Ort übernommen')}else{delete ref.geo;save();el.dispatchEvent(new Event('change',{bubbles:true}))}
 el.blur()}
$.addEventListener('input',e=>{const el=e.target;if(el.dataset.f!=='loc'&&el.dataset.nf!=='loc')return;clearTimeout(acT);acClear();const q=el.value.trim();if(q.length<3||!navigator.onLine)return;const tk=++acTok;
 acT=setTimeout(async()=>{try{const L=await suggest(q);if(tk!==acTok||document.activeElement!==el||!L.length)return;acClear();
  const box=document.createElement('div');box.className='ac';box.innerHTML=L.map((s,i)=>`<div data-i="${i}">${esc(s.main)}${s.sub?`<small>${esc(s.sub)}</small>`:''}</div>`).join('');
  box.addEventListener('pointerdown',ev=>ev.preventDefault());box.addEventListener('click',ev=>{const d=ev.target.closest('[data-i]');if(d)acPick(el,L[+d.dataset.i])});el.after(box)}catch(err){}},350)});
$.addEventListener('focusout',e=>{if(e.target.dataset&&(e.target.dataset.f==='loc'||e.target.dataset.nf==='loc')){acTok++;acClear()}});

/* --- Einstellungen: Google-Maps-Schlüssel --- */
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.tk){LS.set('tile_url',e.target.value.trim())}if(e.target.dataset&&e.target.dataset.gk){LS.set('gmaps_key',e.target.value.trim());gBroken=false;GM.p=null}});

/* --- render erweitern: Karte nach jedem Neuaufbau starten --- */
const _r2=render;
render=function(){mapDestroy();_r2();mapBoot()};

</script>
<script>
/* ===================== Wetter-Tab (Open-Meteo, ohne Schlüssel) ===================== */
(function(){const st=document.createElement('style');st.textContent=
'.wxc{padding:12px 14px}.wxc .wh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.wxc .wh b{font-size:15px}.wxc .wt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ac2)}'+
'.wxm{display:flex;align-items:center;gap:12px;margin-top:8px}.wxi{font-size:40px;line-height:1}.wxm b{font-size:22px}.wxlo{color:var(--mut);font-weight:400;font-size:17px}.wxm small{display:block;color:var(--mut);font-size:13px}'+
'.wxd{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--tx)}'+
'.wxl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--bd);font-size:14px}.wxl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wxl small{color:var(--mut)}.wxl button{flex:none;font-size:13px;padding:5px 10px}'+
'.wxp{margin-top:8px}.wxch{display:flex;flex-wrap:wrap;gap:6px}.wxch button{font-size:13px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wxch button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}'+
'.wxman{display:flex;gap:6px;margin-top:8px}.wxman input{flex:1;min-width:0}';
document.head.append(st)})();
const WXC={};try{Object.assign(WXC,JSON.parse(LS.get('wx_cache')||'{}'))}catch(e){}
const wxOpen=new Set();let wxTok=0,wxSt={loading:false,err:false};
const wxPersist=()=>{const lim=Date.now()-5*864e5,ks=Object.keys(WXC);ks.forEach(k=>{if(WXC[k].ts<lim)delete WXC[k]});const r=Object.keys(WXC);if(r.length>900)r.slice(0,r.length-900).forEach(k=>delete WXC[k]);LS.set('wx_cache',JSON.stringify(WXC))};
